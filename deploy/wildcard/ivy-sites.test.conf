# ─────────────────────────────────────────────────────────────────────────────
# Ivy Events — сајтовите на *.test.ivyevents.mk  (ТЕСТ)
#
# Истото како ivy-sites.prod.conf, за тест-серверот: покани и микросајтови на
# <име>.test.ivyevents.mk. Податоците ги земаат од api.test.ivyevents.mk.
#
# Каде оди:   /opt/ivy-events/infra/nginx/conf.d/ivy-sites.conf  (на тест-серверот)
# Бара:       DNS  A  *.test  → 138.68.65.94
#             сертификат /etc/letsencrypt/live/test.ivyevents.mk-wildcard/
#             (посебен — *.ivyevents.mk не покрива две нивоа)
#             upstream fe_upstream (веќе дефиниран во главната конфигурација)
#             во be.env: IVY_MICROSITE_PLATFORMDOMAIN=test.ivyevents.mk
#
# Точните имиња (test., api.test., auth.test., www.test.) имаат свои блокови
# и nginx ги избира пред овој regex.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name "~^[a-z0-9][a-z0-9-]{0,62}\.test\.ivyevents\.mk$";
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name "~^[a-z0-9][a-z0-9-]{0,62}\.test\.ivyevents\.mk$";

    ssl_certificate     /etc/letsencrypt/live/test.ivyevents.mk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.ivyevents.mk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Request-Id $request_id always;

    # Runtime конфигурацијата на FE — никогаш од кеш.
    location = /env.js {
        proxy_pass http://fe_upstream/env.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/javascript; charset=utf-8" always;
    }

    location / {
        proxy_pass http://fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
