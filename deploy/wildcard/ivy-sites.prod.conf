# ─────────────────────────────────────────────────────────────────────────────
# Ivy Events — сајтовите на *.ivyevents.mk  (ПРОДУКЦИЈА)
#
# Покани (ana-marko.ivyevents.mk), микросајтови на добавувачи и сајтови на
# агенции. Истиот SPA: апликацијата го чита името од hostname-от и сама бара
# кој сајт е, па тука нема rewrite. Блогот останува на ivyevents.mk/mk/blog/…
#
# Каде оди:   /opt/ivy-events/infra/nginx/conf.d/ivy-sites.conf
# Бара:       DNS  A  *  → IP на продукцијата
#             сертификат /etc/letsencrypt/live/ivyevents.mk-wildcard/
#             upstream fe_upstream (веќе дефиниран во главната конфигурација)
#
# Точните имиња (api., auth., www., test.) имаат свои блокови и nginx секогаш
# ги избира пред овој regex, па не се засегнати. Едно ниво, без точка:
# a.b.ivyevents.mk не одговара на ништо.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name "~^[a-z0-9][a-z0-9-]{0,62}\.ivyevents\.mk$";
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name "~^[a-z0-9][a-z0-9-]{0,62}\.ivyevents\.mk$";

    ssl_certificate     /etc/letsencrypt/live/ivyevents.mk-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ivyevents.mk-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Request-Id $request_id always;

    # Runtime конфигурацијата на FE — никогаш од кеш.
    location = /env.js {
        proxy_pass http://fe_upstream/env.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "application/javascript; charset=utf-8" always;
    }

    location / {
        proxy_pass http://fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
