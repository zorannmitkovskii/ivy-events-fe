function updateVendors(){if(page!=='vendors')return;let q=$('vendorSearch').value.toLocaleLowerCase('mk'),cat=$('vendorCategory').value;let list=data.vendors.filter(v=>(cat==='all'||v.category===cat)&&(!q||(v.name+' '+v.city).toLocaleLowerCase('mk').includes(q)));$('vendorResults').innerHTML=`<div class="cards">${list.map(v=>`<article class="card"><span class="tag neutral">${v.category}</span><h3>${v.name}</h3><p>${v.city}</p><div class="meta"><div>${role==='admin'?`<strong>${v.event}</strong><br>${v.status}`:'Достапен во именикот'}</div><button class="mini-link" data-vendor="${v.name}">Детали →</button></div></article>`).join('')}</div>`+(list.length?'':'<div class="empty">Нема добавувачи за избраниот филтер.</div>')}
function teamPage(){return `<div class="grid4">${stat('Членови',3,'Активни членови','users')}${stat('Настани во работа',3,'Активни настани','calendar')}${stat('Задоцнети задачи',15,'Распределени меѓу тимот','task','danger')}${stat('Без одговорен',0,'Нема недоделени задачи','task')}</div><div class="sectionline"><div><h2>Членови и ангажман</h2><p>Погледни го оптоварувањето пред да доделиш нов настан.</p></div>${action('+ Покани член','preview','Покана за член')}</div>${filterShell(`<div class="tablewrap"><table class="table"><thead><tr><th>Член</th><th>Улога</th><th>Вклучен во</th><th>Задоцнети задачи</th><th>Дејства</th></tr></thead><tbody>${data.team.map(u=>`<tr><td><strong>${u.name}</strong></td><td>${u.role}</td><td>${u.events} настани</td><td>${tag(String(u.late),u.late?'red':'green')}</td><td><button class="mini-link" data-person="${u.name}">Преглед →</button></td></tr>`).join('')}</tbody></table></div>`)}`}
function permissionsPage(){let rows=[['Преглед на сите настани',1,0],['Преглед на доделени настани',1,1],['Агенциски клиенти и pipeline',1,0],['Агенциски извештаи и буџети',1,0],['Именик на добавувачи',1,1],['Управување со членови',1,0],['Дозволи и поставки',1,0]];return `<div class="layout2 equal"><section class="panel panelpad"><h3>Модел на пристап</h3><p class="lead">Улогата одредува достапни страници; доделувањето одредува кои настани и задачи се видливи.</p><div class="panelrow"><div><strong>Администратор</strong><small>Сите настани, клиенти, извештаи и управување.</small></div>${tag('Агенција','green')}</div><div class="panelrow"><div><strong>Член на тим</strong><small>Само доделени настани, свои задачи и именик.</small></div>${tag('Доделени','neutral')}</div></section><section class="panel panelpad"><h3>Проверки во backend</h3><p class="lead">Скриеното мени не е доволно за контрола на пристап.</p><div class="panelrow"><strong>Проверка на agency ID за секое барање</strong></div><div class="panelrow"><strong>Проверка на доделување на настан</strong></div><div class="panelrow"><strong>Одвоени права за финансиски податоци</strong></div></section></div><div class="sectionline"><div><h2>Матрица на дозволи</h2><p>Преглед на правила; интерактивно менување на улоги бара посебна имплементација.</p></div></div>${filterShell(`<div class="tablewrap"><table class="table matrix"><thead><tr><th>Дејство</th><th>Администратор</th><th>Член</th></tr></thead><tbody>${rows.map(([name,a,m])=>`<tr><td>${name}</td><td class="${a?'check':'no'}">${a?'✓':'—'}</td><td class="${m?'check':'no'}">${m?'✓':'—'}</td></tr>`).join('')}</tbody></table></div>`)}`}
function reportsPage(){let valid=data.events.filter(e=>e.status==='active'),totalGuests=valid.reduce((n,e)=>n+e.guest,0),answered=valid.reduce((n,e)=>n+e.answered,0),budgets=valid.reduce((n,e)=>n+e.budget,0),spent=valid.reduce((n,e)=>n+e.spent,0);return `<div class="grid4">${stat('Активни настани',valid.length,'+ 1 нацрт','calendar')}${stat('RSVP одговори',Math.round(answered/totalGuests*100)+'%',`${answered} од ${totalGuests} гости`,'contact')}${stat('Задоцнети задачи',15,'Проверка по настан','task','danger')}${stat('Евидентирани трошоци',money(spent),'Буџет: '+money(budgets),'chart')}</div><div class="sectionline"><div><h2>Извештаи на агенцијата</h2><p>Мерливи податоци од постоечките настани, задачи, гости и буџети.</p></div>${action('Извоз CSV','preview','Извоз извештај')}</div><div class="layout2 equal"><section class="panel panelpad"><h3>Настани по месец</h3><p class="lead">Број на активни настани во примерот.</p><div class="simplechart"><div class="barcol"><b>0</b><i style="height:5px"></i><span>сеп</span></div><div class="barcol"><b>2</b><i style="height:130px"></i><span>окт</span></div><div class="barcol"><b>1</b><i style="height:65px"></i><span>ное</span></div><div class="barcol"><b>0</b><i style="height:5px"></i><span>дек*</span></div></div><p class="lead" style="margin-top:12px">* Декемврискиот настан е нацрт и не се брои како активен.</p></section><section class="panel panelpad"><h3>Што бара интервенција</h3><p class="lead">Бројките водат до нивниот извор.</p><div class="panelrow"><div><strong>15 задоцнети задачи</strong><small>5 по активен настан</small></div>${action('Отвори','goto','tasks')}</div><div class="panelrow"><div><strong>19 гости без RSVP</strong><small>Во трите активни настани</small></div>${action('Настани','goto','events')}</div><div class="panelrow"><div><strong>1 настан над буџет</strong><small>Марија & Филип · +9.000 ден.</small></div>${action('Преглед','goto','events')}</div></section></div><p class="footerhint">Овој извештај не прикажува приход, клиентски уплати или маржа: за нив се потребни посебни финансиски податоци.</p>`}
function settingsPage(){let tabs=[['general','Општо'],['brand','Бренд'],['notifications','Известувања'],['plan','Пакет']];let content={general:[['Име на агенција','Ивена Агенција'],['Временски појас','Europe/Skopje'],['Јазик','Македонски'],['Валута за буџет','МКД']],brand:[['Име на бренд','Ivy Events · Ивена'],['Примарна боја','#1F3D2B'],['Лого','Примерно лого'],['Потпис на покана','Ивена Агенција']],notifications:[['Задоцнети задачи','За одговорното лице и администраторот'],['Рокови за настан','7 дена и 1 ден пред рок'],['RSVP потсетници','По акција на организатор'],['Потврди од добавувачи','За одговорниот организатор']],plan:[['Тековен пакет','Пример: Organizer Pro'],['Членови на тим','3 активни'],['Активни настани','3'],['Наплата','Управување со претплата во посебен тек']]};return `<section class="panel"><div class="setting-tabs">${tabs.map(([id,title])=>`<button class="${settingsTab===id?'active':''}" data-settings-tab="${id}">${title}</button>`).join('')}</div><div class="settingsform">${content[settingsTab].map(([label,value])=>`<div><label>${label}</label><div class="sampleinput">${value}</div></div>`).join('')}<div class="wide">${action('Зачувај промени','preview','Зачувување поставки')}<p class="muted" style="margin-top:10px">Мокап: полињата се пример, зачувувањето не менува податоци.</p></div></div></section>`}
function render(){if(role==='member'&&!['dashboard','events','calendar','tasks','vendors'].includes(page))page='dashboard';renderNav();let idx=role==='admin'?0:1;let title=titles[page][idx];$('crumb').textContent=title;$('title').textContent=title;$('eyebrow').textContent=role==='admin'?'Преглед на агенцијата':'Работен простор · Ивана';const descriptions={dashboard:role==='admin'?'Сите настани, ризици и рокови на едно место.':'Моите настани, задачи и рокови на едно место.',events:'Преглед на настаните достапни за тековната улога.',calendar:'Настани и рокови во временски распоред.',tasks:'Работа по настан, одговорно лице и рок.',clients:'Од прво барање до активен клиент.',vendors:'Именик и поврзани добавувачи.',team:'Членови, ангажман и распределба на работата.',permissions:'Дозволи засновани на улога и доделување.',reports:'Метрики од настаните и оперативната работа.',settings:'Поставки за агенцијата и нејзиниот изглед.'};$('subtitle').textContent=descriptions[page];$('headActions').innerHTML=page==='dashboard'?action(role==='admin'?'+ Нов настан':'+ Нова задача','preview','Креирање'):page==='events'?action(role==='admin'?'+ Нов настан':'+ Нова задача','preview','Креирање'):'';$('footerhint').textContent=role==='member'?'Членот нема глобален пристап до клиенти, тим, дозволи, извештаи, буџети и поставки на агенцијата.':'Вредностите во прототипот се примерни; финансиските индикатори користат само буџет и евидентирани трошоци.';let fn={dashboard,events:eventsPage,calendar:calendarPage,tasks:tasksPage,clients:clientsPage,vendors:vendorsPage,team:teamPage,permissions:permissionsPage,reports:reportsPage,settings:settingsPage}[page];$('page').innerHTML=fn();if(page==='events')updateEvents();if(page==='tasks')updateTasks();if(page==='vendors')updateVendors()}
document.addEventListener('click',e=>{let t=e.target.closest('[data-page],[data-jump],[data-action],[data-view],[data-task-view],[data-cal-view],[data-cal-prev],[data-cal-next],[data-settings-tab],[data-open-event],[data-task-id],[data-client],[data-vendor],[data-person]');if(!t)return;if(t.dataset.page){page=t.dataset.page;render();window.scrollTo({top:0,behavior:'smooth'});$('sidebar').classList.remove('open')}else if(t.dataset.jump){if(t.dataset.jump){page=t.dataset.jump;render();window.scrollTo({top:0,behavior:'smooth'})}}else if(t.dataset.view){view=t.dataset.view;render()}else if(t.dataset.taskView){taskView=t.dataset.taskView;render()}else if(t.dataset.calView){calendarView=t.dataset.calView;render()}else if(t.dataset.calPrev){calendarOffset=Math.max(-1,calendarOffset-1);render()}else if(t.dataset.calNext){calendarOffset=Math.min(5,calendarOffset+1);render()}else if(t.dataset.settingsTab){settingsTab=t.dataset.settingsTab;render()}else if(t.dataset.openEvent){let ev=data.events.find(x=>x.id===Number(t.dataset.openEvent));if(!ev||role==='member'&&!assigned(ev))return;modal(ev.name,`${ev.type} · ${date(ev.date)} · ${ev.location}`,`Клиент: ${ev.client}. Главен организатор: ${ev.lead}. Следен чекор: ${ev.next}. ${role==='admin'&&ev.budget?'Буџет: '+money(ev.budget)+'; внесени трошоци: '+money(ev.spent)+'.':''}`)}else if(t.dataset.taskId){let task=tasks.find(x=>x.id===Number(t.dataset.taskId));if(!task||role==='member'&&task.assignee!=='Ивана')return;modal(task.title,`${task.event} · одговорен: ${task.assignee}`,`Рок: ${date(task.due)}. Статус: ${task.status==='overdue'?'задоцнета':'претстои'}.`)}else if(t.dataset.client){modal(t.dataset.client,'Клиентски запис достапен за администраторот.','Во целосната апликација тука се гледаат поврзани настани, историја и дозволени контакти.')}else if(t.dataset.vendor){let v=data.vendors.find(x=>x.name===t.dataset.vendor);modal(v.name,`${v.category} · ${v.city}`,role==='admin'?`Статус: ${v.status}. Настан: ${v.event}.`:'Именик на добавувачи. Договори и цени не се достапни во оваа улога.')}else if(t.dataset.person){modal(t.dataset.person,'Работа на членот на тимот.','Поглед по настани, задачи и обем на работа.')}else if(t.dataset.action==='goto'){page=t.dataset.detail;render();window.scrollTo({top:0,behavior:'smooth'})}else if(t.dataset.action){notify(`${t.dataset.detail||'Ова дејство'} е пример во прототипот.`)}});
document.addEventListener('input',e=>{if(['eventSearch','vendorSearch'].includes(e.target.id))e.target.id==='eventSearch'?updateEvents():updateVendors()});document.addEventListener('change',e=>{if(['eventStatus','eventPeriod','eventOwner'].includes(e.target.id))updateEvents();if(['taskStatus','taskEvent','taskAssignee'].includes(e.target.id))updateTasks();if(e.target.id==='vendorCategory')updateVendors()});$('asAdmin').addEventListener('click',()=>{role='admin';render()});$('asMember').addEventListener('click',()=>{role='member';render()});$('mobileBtn').addEventListener('click',()=>$('sidebar').classList.toggle('open'));$('close').addEventListener('click',closeModal);$('dismiss').addEventListener('click',closeModal);$('shade').addEventListener('click',e=>{if(e.target===$('shade'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('sidebar').classList.remove('open')}});render();
</script></body></html>
