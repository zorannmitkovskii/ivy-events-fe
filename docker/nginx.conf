server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime env file (VERY IMPORTANT). The path index.html actually requests
    # is /public/env.js — /env.js is the unrendered copy Vite leaves in the
    # build root. no-store on the wrong one means a stale API URL survives a
    # redeploy and the app talks to the previous environment's backend.
    location = /public/env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
